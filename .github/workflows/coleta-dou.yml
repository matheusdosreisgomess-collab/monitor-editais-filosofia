name: Coleta DOU

on:
  schedule:
    - cron: "17 8 * * *"    # todo dia às 05h17 em Brasília; reprocessa os 2 dias anteriores para pegar edições extras
  workflow_dispatch:
    inputs:
      retro:
        description: "Dias anteriores a reprocessar"
        default: "2"
  push:
    branches: [main]
    paths:
      - "coletor/**"
      - "requirements.txt"
      - ".github/workflows/coleta-dou.yml"

permissions:
  contents: write

concurrency:
  group: coleta-dou
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Coletar
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: python coletor/dou.py --retro "${{ github.event.inputs.retro || '2' }}"
      - name: Gravar resultado
        if: always()
        run: |
          git config user.name "robo-editais"
          git config user.email "robo-editais@users.noreply.github.com"
          git add dados || true
          if git diff --cached --quiet; then
            echo "Nada novo para gravar."
          else
            git commit -m "Coleta DOU $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
          fi
